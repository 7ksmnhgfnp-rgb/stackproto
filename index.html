<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121212"><title>Stack · Kamera-Zähler</title>
<style>
:root{--bg:#121212;--card:#232323;--ac:#e4ff3a;--mu:#a5a5a5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font:500 16px Inter,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
h1{font:800 22px "Bricolage Grotesque",Inter,sans-serif;margin:0 0 2px}.mu{color:var(--mu);margin:0;font-size:14px}
.card{background:var(--card);border-radius:30px;padding:18px;margin-top:14px}
.tabs{display:flex;gap:8px;margin-top:14px}.tab{flex:1;border:0;border-radius:999px;padding:12px;font:700 15px Inter,sans-serif;background:#333;color:#fff}.tab.on{background:var(--ac);color:#121212}
.big{font:800 min(38vw,150px)/1 "Bricolage Grotesque",Inter,sans-serif;color:var(--ac);text-align:center;margin:2px 0 6px}
.lbl{text-align:center;font-weight:700;letter-spacing:.08em;color:var(--mu);font-size:12px}
.vw{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:4/3;touch-action:none}
.vw video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.vw canvas.ov{position:absolute;inset:0;width:100%;height:100%}
.roi{position:absolute;border:2px solid var(--ac);background:rgba(228,255,58,.12);border-radius:6px;pointer-events:none}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px;font:700 17px Inter,sans-serif;background:var(--ac);color:#121212;margin-top:12px}.btn.g{background:#333;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.st{display:inline-block;padding:5px 12px;border-radius:99px;background:#333;font-weight:700;font-size:12px}.st.on{background:var(--ac);color:#121212}
select,input[type=range]{width:100%;margin-top:8px;accent-color:#e4ff3a}
select{background:#333;color:#fff;border:0;border-radius:14px;padding:12px;font:600 15px Inter,sans-serif}
#hint{font-size:13px;color:var(--mu);line-height:1.45;margin:10px 2px 0}
canvas#gr{width:100%;height:90px;display:block;margin-top:10px;border-radius:14px;background:#1a1a1a}
</style></head><body>
<h1>Kamera-Zähler</h1><p class="mu">Prototyp: Wiederholungen am Gerät per Kamera zählen.</p>
<div class="tabs"><button class="tab on" id="tB">Gewichtsblock</button><button class="tab" id="tP">Körper</button></div>
<div class="card"><div class="lbl">WIEDERHOLUNGEN</div><div class="big" id="n">0</div>
<div class="row"><span class="st" id="st">Bereit</span><span class="mu" id="info"></span></div>
<canvas id="gr" width="600" height="180"></canvas></div>
<div class="card"><div class="vw" id="vw"><video id="v" playsinline muted></video><canvas class="ov" id="ov" width="320" height="240"></canvas><div class="roi" id="roi"></div></div>
<div id="pw" style="display:none"><div class="mu" style="margin-top:12px">Übung</div><select id="ex"></select></div>
<p id="hint"></p>
<div class="row" style="margin-top:12px"><span class="mu">Empfindlichkeit</span><span class="mu" id="sv">mittel</span></div><input id="sens" type="range" min="1" max="9" value="5">
<button class="btn" id="go">Kamera starten</button><div class="row" style="gap:10px"><button class="btn g" id="fl">Kamera wechseln</button><button class="btn g" id="rs">Zurücksetzen</button></div>
<button class="btn g" id="dm">Demo ohne Kamera</button></div>
<script type="module">
/* ═══ Kern ohne Oberfläche ═══ */
export function RepCounter(){
  const s={h:[],state:null,n:0,last:0,ema:null,minRange:6,a:.4};
  s.reset=()=>{s.h=[];s.state=null;s.n=0;s.last=0;s.ema=null};
  s.push=(v,t)=>{
    s.ema=s.ema==null?v:s.ema+s.a*(v-s.ema);const x=s.ema;
    s.h.push([t,x]);while(s.h.length&&t-s.h[0][0]>8000)s.h.shift();
    let mn=1e9,mx=-1e9;for(const q of s.h){if(q[1]<mn)mn=q[1];if(q[1]>mx)mx=q[1]}
    const rg=mx-mn;if(rg<s.minRange)return{ok:false,x,mn,mx};
    const lo=mn+rg*.35,hi=mn+rg*.65;let rep=false;
    if(s.state==null)s.state=x>mn+rg*.5?"hi":"lo";
    if(s.state==="hi"&&x<lo)s.state="lo";
    else if(s.state==="lo"&&x>hi){s.state="hi";if(t-s.last>600){s.n++;s.last=t;rep=true}}
    return{ok:true,x,mn,mx,lo,hi,rep,state:s.state};
  };
  return s}
/* Vertikale Bewegung eines Bildausschnitts (Spaltenprofil, 1D-Verschiebung) */
export function BlockTracker(){
  const s={refs:[],pos:[],K:3,R:8,base:0,hp:null,last:null};
  s.reset=()=>{s.refs=[];s.pos=[];s.hp=null};
  const norm=P=>{const n=P.length,o=new Float32Array(n),w=6;for(let i=0;i<n;i++){let a=0,c=0;for(let j=Math.max(0,i-w);j<=Math.min(n-1,i+w);j++){a+=P[j];c++}o[i]=P[i]-a/c}return o};
  s.push=(P0,t)=>{
    const P=norm(P0),n=P.length;let p=0;
    if(s.refs.length>=s.K){const ref=s.refs[s.refs.length-s.K],pr=s.pos[s.pos.length-s.K];
      let best=0,bc=1e18,cs={},sum=0,m=0;
      for(let d=-s.R;d<=s.R;d++){let c=0,k=0;for(let y=s.R;y<n-s.R;y++){c+=Math.abs(P[y]-ref[y+d]);k++}c/=k;cs[d]=c;sum+=c;m++;if(c<bc){bc=c;best=d}}
      const mean=sum/m;let d=best;
      if(bc>mean*.92)d=0;                       /* kein eindeutiges Maximum: keine Bewegung annehmen */
      else if(best>-s.R&&best<s.R){const a=cs[best-1],b=cs[best],c=cs[best+1],den=a-2*b+c;if(den>1e-9)d=best+.5*(a-c)/den}
      p=pr+d}
    else p=s.pos.length?s.pos[s.pos.length-1]:0;
    s.refs.push(P);s.pos.push(p);if(s.refs.length>s.K+2){s.refs.shift();s.pos.shift()}
    s.hp=s.hp==null?p:s.hp+(1-Math.exp(-(1/30)/6))*(p-s.hp);   /* langsamer Drift raus */
    s.last=p-s.hp;return s.last};
  return s}
/* Winkel und Höhen aus Körperpunkten */
export const LM={LS:11,RS:12,LE:13,RE:14,LW:15,RW:16,LH:23,RH:24,LK:25,RK:26,LA:27,RA:28};
export const EXS=[
 {id:"curl",name:"Bizeps-Curl / Beinbeuger (Winkel)",f:(p,sd)=>ang(p[sd?LM.LS:LM.RS],p[sd?LM.LE:LM.RE],p[sd?LM.LW:LM.RW]),k:[["S","E","W"]],scale:1,min:25},
 {id:"press",name:"Bankdrücken / Schulterdrücken (Handgelenk-Höhe)",f:(p,sd)=>-(p[sd?LM.LW:LM.RW].y)*100,k:[["W"]],scale:1,min:8},
 {id:"squat",name:"Kniebeuge / Beinpresse (Hüft-Höhe)",f:(p,sd)=>-(p[sd?LM.LH:LM.RH].y)*100,k:[["H"]],scale:1,min:6},
 {id:"pull",name:"Klimmzug / Latzug (Schulter-Höhe)",f:(p,sd)=>-(p[sd?LM.LS:LM.RS].y)*100,k:[["S"]],scale:1,min:6},
 {id:"push",name:"Liegestütz (Schulter-Höhe)",f:(p,sd)=>-(p[sd?LM.LS:LM.RS].y)*100,k:[["S"]],scale:1,min:5}];
export function ang(a,b,c){const v1=[a.x-b.x,a.y-b.y],v2=[c.x-b.x,c.y-b.y],d=v1[0]*v2[0]+v1[1]*v2[1],m=Math.hypot(...v1)*Math.hypot(...v2);return m?Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI:0}
export function pickSide(p){const vl=(p[LM.LS].visibility+p[LM.LE].visibility+p[LM.LW].visibility+p[LM.LH].visibility)/4,vr=(p[LM.RS].visibility+p[LM.RE].visibility+p[LM.RW].visibility+p[LM.RH].visibility)/4;return vl>=vr}
/* ═══ Oberfläche ═══ */
if(typeof document!=="undefined"){
const $=i=>document.getElementById(i);let mode="B",run=false,stream=null,facing="environment",tm=null,wl=null,demo=0,pose=null,poseLoading=false;
const RC=RepCounter(),BT=BlockTracker();let roi={x:.3,y:.1,w:.4,h:.8};let sig=[];const cv=document.createElement("canvas");cv.width=160;cv.height=120;const cx=cv.getContext("2d",{willReadFrequently:true});
$("ex").innerHTML=EXS.map(e=>`<option value="${e.id}">${e.name}</option>`).join("");
const sensMap=v=>({1:.5,2:.65,3:.8,4:.9,5:1,6:1.15,7:1.3,8:1.5,9:1.8})[v];
function hint(){ $("hint").textContent=mode==="B"?"Handy fest stellen und auf den Gewichtsblock richten. Ziehe mit dem Finger ein Rechteck über die Platten, so dass viel vom Block drin ist. Dann Start und mit dem Training beginnen.":"Handy seitlich stellen, so dass du von Kopf bis Fuß (oder zumindest Rumpf und Arme) zu sehen bist. Wähle die Übung. Beim ersten Start wird ein kleines Modell geladen (Internet nötig)."}
function setMode(m){mode=m;$("tB").className="tab"+(m==="B"?" on":"");$("tP").className="tab"+(m==="P"?" on":"");$("pw").style.display=m==="P"?"block":"none";$("roi").style.display=m==="B"?"block":"none";RC.reset();BT.reset();sig=[];$("n").textContent=0;hint();applyEx()}
function applyEx(){const e=EXS.find(x=>x.id===$("ex").value)||EXS[0];RC.minRange=mode==="B"?3/sensMap(+$("sens").value):e.min/sensMap(+$("sens").value)}
$("tB").onclick=()=>setMode("B");$("tP").onclick=()=>setMode("P");$("ex").onchange=()=>{RC.reset();$("n").textContent=0;applyEx()};
$("sens").oninput=e=>{const v=+e.target.value;$("sv").textContent=v<4?"niedrig":v>6?"hoch":"mittel";applyEx()};
function drawRoi(){const r=$("roi").style;r.left=roi.x*100+"%";r.top=roi.y*100+"%";r.width=roi.w*100+"%";r.height=roi.h*100+"%"}drawRoi();
let drag=null;$("vw").addEventListener("pointerdown",e=>{if(mode!=="B")return;const b=$("vw").getBoundingClientRect();drag={x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height};$("vw").setPointerCapture(e.pointerId)});
$("vw").addEventListener("pointermove",e=>{if(!drag)return;const b=$("vw").getBoundingClientRect(),x=Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),y=Math.min(1,Math.max(0,(e.clientY-b.top)/b.height));roi={x:Math.min(drag.x,x),y:Math.min(drag.y,y),w:Math.max(.05,Math.abs(x-drag.x)),h:Math.max(.05,Math.abs(y-drag.y))};drawRoi();BT.reset();RC.reset()});
$("vw").addEventListener("pointerup",()=>{drag=null});
function graph(){const c=$("gr"),g=c.getContext("2d"),W=c.width,H=c.height;g.clearRect(0,0,W,H);if(sig.length<2)return;
 const now=sig[sig.length-1][0],t0=now-8000;let mn=1e9,mx=-1e9;for(const q of sig){if(q[1]<mn)mn=q[1];if(q[1]>mx)mx=q[1]}const rg=Math.max(mx-mn,1e-6);const Y=v=>H-10-(v-mn)/rg*(H-20);
 if(RC.h.length&&last&&last.ok){g.strokeStyle="rgba(255,255,255,.25)";g.setLineDash([6,5]);for(const v of [last.lo,last.hi]){g.beginPath();g.moveTo(0,Y(v));g.lineTo(W,Y(v));g.stroke()}g.setLineDash([])}
 g.strokeStyle="#e4ff3a";g.lineWidth=3;g.beginPath();sig.forEach((q,i)=>{const x=(q[0]-t0)/8000*W;i?g.lineTo(x,Y(q[1])):g.moveTo(x,Y(q[1]))});g.stroke()}
let last=null;
function handle(v,t){const r=RC.push(v,t);last=r;sig.push([t,r.x]);while(sig.length&&t-sig[0][0]>8000)sig.shift();
 if(r.ok){$("st").textContent=r.state==="lo"?"Unten":"Oben";$("st").className="st on";$("info").textContent="Signal ok"}else{$("st").textContent="Stellt sich ein";$("st").className="st";$("info").textContent="Bewegung gering"}
 if(r.rep){$("n").textContent=RC.n;try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}graph()}
/* Quelle: Gewichtsblock */
function tickB(){const v=$("v");if(!v.videoWidth)return;cx.drawImage(v,0,0,160,120);const x0=Math.round(roi.x*160),y0=Math.round(roi.y*120),w=Math.max(4,Math.round(roi.w*160)),h=Math.max(30,Math.round(roi.h*120));
 const d=cx.getImageData(x0,y0,Math.min(w,160-x0),Math.min(h,120-y0));const W=d.width,H=d.height,P=new Float32Array(H);
 for(let y=0;y<H;y++){let s=0;for(let x=0;x<W;x++){const i=(y*W+x)*4;s+=.3*d.data[i]+.59*d.data[i+1]+.11*d.data[i+2]}P[y]=s/W}
 const val=BT.push(P,performance.now());handle(val,performance.now())}
/* Quelle: Koerper */
async function loadPose(){if(pose||poseLoading)return pose;poseLoading=true;$("info").textContent="Modell wird geladen …";
 try{const m=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");const fs=await m.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  pose=await m.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},runningMode:"VIDEO",numPoses:1});$("info").textContent="Modell bereit"}
 catch(e){$("info").textContent="Modell konnte nicht geladen werden (Internet nötig)";pose=null}
 poseLoading=false;return pose}
let lastT=-1;
function tickP(){const v=$("v");if(!pose||!v.videoWidth)return;const t=performance.now();if(t===lastT)return;lastT=t;let r;try{r=pose.detectForVideo(v,t)}catch(e){return}
 const ov=$("ov"),g=ov.getContext("2d");g.clearRect(0,0,ov.width,ov.height);if(!r.landmarks||!r.landmarks[0]){$("info").textContent="Niemand erkannt";return}
 const p=r.landmarks[0],sd=pickSide(p),e=EXS.find(x=>x.id===$("ex").value)||EXS[0];
 g.fillStyle="#e4ff3a";for(const i of Object.values(LM)){g.beginPath();g.arc(p[i].x*ov.width,p[i].y*ov.height,4,0,7);g.fill()}
 handle(e.f(p,sd),t)}
function tick(){if(demo)return;mode==="B"?tickB():tickP()}
async function start(){
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false})}catch(e){$("info").textContent="Kamera nicht erlaubt";return}
 const v=$("v");v.srcObject=stream;v.style.transform=facing==="user"?"scaleX(-1)":"none";await v.play();run=true;RC.reset();BT.reset();sig=[];applyEx();$("go").textContent="Stopp";$("go").className="btn g";
 try{wl=await navigator.wakeLock.request("screen")}catch(e){}
 if(mode==="P")await loadPose();tm=setInterval(tick,mode==="P"?33:33)}
function stop(){run=false;demo=0;clearInterval(tm);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;try{wl&&wl.release()}catch(e){}$("go").textContent="Kamera starten";$("go").className="btn";$("st").textContent="Bereit";$("st").className="st"}
$("go").onclick=()=>run||demo?stop():start();
$("fl").onclick=async()=>{facing=facing==="environment"?"user":"environment";if(run){stop();await start()}};
$("rs").onclick=()=>{RC.reset();BT.reset();sig=[];$("n").textContent=0;graph()};
$("dm").onclick=()=>{if(run||demo){stop();return}demo=1;RC.reset();sig=[];RC.minRange=6;let t=0;$("go").textContent="Stopp";$("go").className="btn g";tm=setInterval(()=>{t+=33;const ph=(t%3200)/3200,v=50+40*Math.sin(2*Math.PI*ph)+(Math.random()-.5)*6;handle(v,t)},33)};
window.__t={handle,RC,BT};
setMode("B");
}
</script></body></html>
